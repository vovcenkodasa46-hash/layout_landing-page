<!-- #region head -->
<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>The MET</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    >
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <header class="header" id="home_page">
      <div class="top-bar header__top">
        <a href="#">
          <img
          src="src/img/THE-MET-logo.png"
          alt="THE MET logo"
          >
        </a>
        <div class="top-bar__icons">
          <a href="#" class="icon icon--phone"></a>
          <a href="#menu" class="icon icon--menu"></a>
        </div>
      </div>
      <div class="header__bottom">
        <h1 class="header__title">Welcome<br>to The MET</h1>
      </div>
    </header>

    <aside id="menu" class="menu page__menu">
      <div class="top-bar menu__top">
        <a href="#">
          <img
          src="src/img/THE-MET-logo.png"
          alt="THE MET logo"
          >
        </a>
        <div class="top-bar__icons">
          <a href="#home_page" class="icon icon--close"></a>
        </div>
      </div>
      <div class="menu__content">
        <div class="menu__nav">
          <nav class="nav menu__navigation">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link" href="#home_page">Home</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#about-us">About Us</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#now-on-view">Now on view</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#explore-online">Explore online</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#contacts">Contacts</a>
              </li>
            </ul>
          </nav>
          <div class="contacts">
            <div class="contacts__avenue">
              <p class="contacts__street">The Met Fifth Avenue</p>
              <a href="tel:+1 212-535-7710" class="contacts__number">+1 212-535-7710</a>
            </div>
            <div class="contacts__cloisters">
              <p class="contacts__street">The Met Cloisters</p>
              <a href="+1 212-923-3700" class="contacts__number">+1 212-923-3700</a>
            </div>
            <div class="contacts__call">
              <a href="tel:+1 212-923-3700" class="contacts__order">call to order</a>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <section id="about-us" class="about-us">
        <h2>Museum hours</h2>
      </section>

      <section id="now-on-view" class="now-on-view">
        <h2>Now On View</h2>
      </section>

      <section id="explore-online" class="explore-online">
        <h2>More to Explore Online</h2>
      </section>

      <section id="contacts" class="contacts">
        <h2>Contact us</h2>
      </section>
    </main>

    <footer class="footer"></footer>

  </body>
</html>
